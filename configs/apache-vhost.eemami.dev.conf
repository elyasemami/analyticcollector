<IfModule mod_ssl.c>
<VirtualHost *:443>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	#ServerName www.example.com

	
    		ServerName eemami.dev
    		ServerAlias www.eemami.dev
  		DocumentRoot /var/www/eemami.dev/public_html
    		ErrorLog ${APACHE_LOG_DIR}/eemami.dev_error.log
    		CustomLog ${APACHE_LOG_DIR}/eemami.dev_access.log combined
		
		ProxyPreserveHost On
	##	ProxyPass /json http://localhost:3000
	##	ProxyPassReverse /json http://localhost:3000
		ProxyPass /api http://localhost:3000/api
		ProxyPassReverse /api http://localhost:3000/api
 	# Allow JSON POST/PUT/DELETE and (if installed) disable ModSecurity for /api
<Location "/api/">
  Require all granted
  <LimitExcept GET POST PUT DELETE OPTIONS>
    Require all denied
  </LimitExcept>

  <IfModule security2_module>
    SecRuleEngine Off
  </IfModule>

  <IfModule mod_headers.c>
    RequestHeader set X-Forwarded-Proto "https"
  </IfModule>
</Location>
	
		ScriptAlias /cgi-bin/ /var/www/eemami.dev/public_html/cgi-bin/
		<Directory /var/www/eemami.dev/public_html/cgi-bin/>
	    	Options +ExecCGI -Indexes -FollowSymLinks
    		AllowOverride None
    		Require all granted
    		AddHandler cgi-script .cgi .pl .py
</Directory>

ErrorLog ${APACHE_LOG_DIR}/eemami.dev-ssl.error.log
CustomLog ${APACHE_LOG_DIR}/eemami.dev-ssl.access.log combined

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn




	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/eemami.dev-0001/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/eemami.dev-0001/privkey.pem
</VirtualHost>
</IfModule>
