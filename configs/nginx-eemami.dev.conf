# /etc/nginx/sites-available/eemami.dev.conf
#
# Replaces configs/legacy/apache-vhost.eemami.dev.conf. Same document root,
# same /api reverse proxy target, same cgi-bin tree — nginx just needs two
# extra pieces Apache had built in:
#   - fcgiwrap: generic CGI runner for the Perl/Python/C scripts under
#     cgi-bin/ (they're plain executables with shebangs; nginx has no
#     built-in mod_cgi equivalent, fcgiwrap is the standard drop-in)
#   - php-fpm: FastCGI process manager for the .php scripts under
#     cgi-bin/php/
#
# Server packages required (not installed by this repo):
#   apt install nginx fcgiwrap php-fpm
#   systemctl enable --now nginx fcgiwrap php8.2-fpm   # adjust php version

server {
    listen 80;
    listen [::]:80;
    server_name eemami.dev www.eemami.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eemami.dev www.eemami.dev;

    root /var/www/eemami.dev/public_html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/eemami.dev-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eemami.dev-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    access_log /var/log/nginx/eemami.dev_access.log;
    error_log  /var/log/nginx/eemami.dev_error.log;

    # ---- monolithic Express/MongoDB API (configs/analyticcollector-api.service) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        limit_except GET POST PUT DELETE OPTIONS { deny all; }
    }

    # ---- CGI homework demos (Homework 2: Python / PHP / Perl / C) ----
    location /cgi-bin/ {
        gzip off;
        root /var/www/eemami.dev/public_html;

        # PHP CGI scripts (cgi-bin/php/*.php) -> php-fpm
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Everything else (.cgi/.pl/.py, compiled C binaries) -> fcgiwrap
        location ~ \.(cgi|pl|py)$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/fcgiwrap.socket;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # top-level static pages, favicon, 404, js/, cse135/, etc. served directly from root
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
