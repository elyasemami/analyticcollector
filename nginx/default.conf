# Mounted into the `proxy` service (nginx:latest) at
# /etc/nginx/conf.d/default.conf — replaces the image's default welcome-page
# config. `api` and `database` below are docker-compose service names,
# resolved via the compose network's built-in DNS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Express/PostgreSQL API container ----
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- static site ----
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
