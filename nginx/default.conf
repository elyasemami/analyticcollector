# Mounted into the `proxy` service (nginx:latest) at
# /etc/nginx/conf.d/default.conf — replaces the image's default welcome-page
# config. `api` and `database` below are docker-compose service names,
# resolved via the compose network's built-in DNS.



server {
    listen 80;
    server_name dashboard.eemami.dev ://dashboard.eemami.dev;
    return 301 https://$host$request_uri;
}

Server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.eemami.dev;
}

server{
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ://dashboard.eemami.dev

    ssl_certificate /etc/nginx/ssl/live/://dashboard.eemami.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/://dashboard.emami.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index database.html;

    # Restores real user IPs instead of showing Cloudflare's internal IPs
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    real_ip_header X-Forwarded-For;


    location /{
        try_files $uri $uri/ =404;
    }


     # ---- Express/PostgreSQL API container ----
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }




    
}
