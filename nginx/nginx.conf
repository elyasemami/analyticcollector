# 1. HTTP to HTTPS Redirect Block
server {
    listen 80;
    listen [::]:80;
    server_name stats.eemami.dev;

    # Redirect all non-SSL traffic to secure HTTPS
    return 301 https://$host$request_uri;
}

# 2. HTTPS Subdomain Configuration
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stats.eemami.dev;

    # SSL Cert Paths (Ensure these are mounted in your docker-compose.yml)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cloudflare Real IP Restoration Settings
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    real_ip_header X-Forwarded-For;

    # Global fallback for static assets
    root /usr/share/nginx/html;

    # Serve static assets (database.html)
    location / {
        index database.html index.html;
        try_files $uri $uri/ =404;
    }

    # Custom 404 Route
    location = /404.html {
        internal;
    }

    # Express API Proxy Pass
    location /api/ {
        proxy_pass http://api:3000; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
