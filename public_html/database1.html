<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Analytics Data (Tabbed)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.zinggrid.com/zinggrid.min.js" defer></script>
  <style>
    :root { --bg:#0b1220; --card:#101827; --muted:#9aa4b2; --fg:#e5e7eb; --accent:#60a5fa; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: linear-gradient(180deg, #0b1220, #0f172a);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--fg);
    }
    header {
      padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,.08);
      position: sticky; top: 0; background: rgba(11,18,32,.85); backdrop-filter: blur(6px); z-index: 10;
    }
    header h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; color: var(--muted); font-size: 14px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }

    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab {
      appearance: none; border: 1px solid rgba(255,255,255,.12);
      background: #0f172a; color: var(--fg); padding: 8px 12px; border-radius: 10px;
      cursor: pointer; font-size: 14px;
    }
    .tab.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(96,165,250,.25) inset; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; }
    .spacer { flex: 1; }
    .btn {
      appearance: none; border: 1px solid rgba(255,255,255,.14); background: #111827; color: var(--fg);
      padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 14px;
    }
    .btn:hover { border-color: var(--accent); }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Card + grid */
    .card {
      background: var(--card); border: 1px solid rgba(255,255,255,.10); border-radius: 14px;
      padding: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    /* Make sure the grid never overlaps anything: single, fixed height per panel */
    zing-grid {
      display: block;
      height: calc(100vh - 220px);  /* header + tabs + paddings */
      min-height: 420px;
      border-radius: 10px;
      --theme-color-primary: #60a5fa;
      --zg-bg: #0b1220;
      --zg-header-bg: #0f172a;
      --zg-border-color: rgba(255,255,255,.12);
      --zg-text-color: #e5e7eb;
    }
    @media (max-width: 800px) {
      zing-grid { height: calc(100vh - 260px); }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <h1>Analytics Data</h1>
    <p>Live, Analytics!!.</p>
  </header>

  <div class="wrap">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-target="panel-static">Static</button>
      <button class="tab" data-target="panel-perf">Performance</button>
      <button class="tab" data-target="panel-activity">Activity</button>
    </div>

    <!-- Static Panel -->
    <div id="panel-static" class="panel active">
      <div class="card">
        <div class="toolbar">
          <strong>Static Snapshots</strong>
          <div class="spacer"></div>
          <button class="btn" data-refresh="#grid-static">Reload</button>
        </div>
        <zing-grid id="grid-static" src="/api/static" pager page-size="15" search sort>
          <!-- Define a few helpful columns; others auto-appear -->
          <zg-column index="_id" header="_id" width="220"></zg-column>
          <zg-column index="session_id" header="session" width="180"></zg-column>
          <zg-column index="page" header="page" width="180"></zg-column>
          <zg-column index="ts" header="timestamp" type="datetime" width="180"></zg-column>
          <zg-column index="language" header="lang" width="80"></zg-column>
          <zg-column index="cookies_enabled" header="cookies" type="boolean" width="90"></zg-column>
          <zg-column index="js_enabled" header="js" type="boolean" width="70"></zg-column>
          <zg-column index="images_allowed" header="images" type="boolean" width="90"></zg-column>
          <zg-column index="css_allowed" header="css" type="boolean" width="70"></zg-column>
          <zg-column index="connection" header="net" width="90"></zg-column>
        </zing-grid>
      </div>
    </div>

    <!-- Performance Panel -->
    <div id="panel-perf" class="panel">
      <div class="card">
        <div class="toolbar">
          <strong>Performance</strong>
          <div class="spacer"></div>
          <button class="btn" data-refresh="#grid-perf">Reload</button>
        </div>
        <zing-grid id="grid-perf" src="/api/perf" pager page-size="15" search sort>
          <zg-column index="_id" header="_id" width="220"></zg-column>
          <zg-column index="session_id" header="session" width="180"></zg-column>
          <zg-column index="page" header="page" width="180"></zg-column>
          <zg-column index="total_ms" header="total ms" type="number" width="110"></zg-column>
          <zg-column index="started_at" header="started" type="datetime" width="180"></zg-column>
          <zg-column index="ended_at" header="ended" type="datetime" width="180"></zg-column>
          <zg-column index="nav_type" header="nav.type" width="110"></zg-column>
        </zing-grid>
      </div>
    </div>

    <!-- Activity Panel -->
    <div id="panel-activity" class="panel">
      <div class="card">
        <div class="toolbar">
          <strong>Activity Events</strong>
          <div class="spacer"></div>
          <button class="btn" data-refresh="#grid-activity">Reload</button>
        </div>
        <zing-grid id="grid-activity" src="/api/activity" pager page-size="25" search sort>
          <zg-column index="_id" header="_id" width="220"></zg-column>
          <zg-column index="session_id" header="session" width="180"></zg-column>
          <zg-column index="page" header="page" width="180"></zg-column>
          <zg-column index="ts" header="timestamp" type="datetime" width="180"></zg-column>
          <zg-column index="kind" header="kind" width="100"></zg-column>
          <zg-column index="type" header="type" width="120"></zg-column>
        </zing-grid>
      </div>
    </div>
  </div>

  <script>
    // Simple tabs (one visible panel at a time)
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });

    // “Reload” buttons: force ZingGrid to re-fetch by cache-busting the src
    document.querySelectorAll('[data-refresh]').forEach(btn => {
      btn.addEventListener('click', () => {
        const sel = btn.getAttribute('data-refresh');
        const grid = document.querySelector(sel);
        if (!grid) return;
        const base = (grid.getAttribute('src') || '').split('?')[0];
        grid.setAttribute('src', base + '?_ts=' + Date.now());
      });
    });
  </script>
</body>
</html>
