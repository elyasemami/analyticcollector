<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Guess the number</title>

<style>
body { font-family: system-ui, Arial, sans-serif; margin: 40px; }
.card { max-width: 520px; border: 1px solid #ddd; border-radius: 12px; padding: 20px; }
button { padding: 8px 14px; border-radius: 8px; border: 1px solid #333; cursor: pointer; }
input { padding: 8px; border-radius: 8px; border: 1px solid #aaa; width: 140px; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.muted { color: #666; font-size: 0.9rem; }
#message { margin-top: 12px; font-weight: 600; }
</style>
</head>

<body>
<div class="card">
<h2>Guess the Number (1–100)</h2>
<p class="muted">You have 10 tries. Hints will tell you if your guess is too low or too high.</p>


<div class="row">
<input id="guess" type="number" placeholder="Enter a number" min="1" max="100" />
<button id="check">Guess</button>
<button id="reset">Reset</button>
</div>


<div id="message"></div>
<p class="muted" id="triesLeft"></p>
</div>

<script>

//Creating the game state
let secret = Math.floor(Math.random()*100) +1;
let tries = 10;


//update UI text
function setText(id, text){
	document.getElementbyId(id).textContent = text;
}

//check one guess
function checkGuess(){
	const input = document.getElementById('guess');
	const value = Number(input.value);
	if(!value|| value<1 || value > 100){
		setText('message','Enter a number between 1 and 100.');
		return;
	}
}

tries--;

if(value == secret){
	setText('message', `Correct! ${value} is the number.`);
}else if(value > secret){
	setText('message', `incorrect! ${value} is larger than the secret.`);	
}else if(value < secret){
	setText('message', `incorrect! ${value} is really tiny!`);
}else{
	setText("bye! no more try!");
}

function endGame(){
	document.getElementById('check').disabled = true;
	document.getElementById('guess').disabled = true;
}

function resetGame(){

	secret = Math.floor(Math.random()*100) + 1;
	tries = 10;
	setText('message', 'New game started.');
	settext('triesLeft', `Tries left: ${tries}`);
	document.getElementById('check').disabled = false;
	document.getElementById('guess').disabled = false;
	document.getElementById('guess').value = '';
	document.getElementById('guess').focus();
}

//wire up events

document.getElementById('check').addEventListener('click', checkGuess);
document.getElementById('reset').addEventListener('click', resetGame);
document.getElementById('guess').addEventListener('keydown', function (e){if (e.key === 'Enter') checkGuess();

});

//init UI 
setText('triesLeft', `Tries left: ${tries}`);
document.getElementById('guess').focus();

</script>

</body>
</html>
