<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PHP POST Form</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:2rem}
    textarea{width:100%;max-width:680px}
  </style>
</head>
<body>
  <h1>Post a Note (PHP)</h1>
  <form method="post" action="/cgi-bin/php/php-post-echo.php" accept-charset="utf-8">
    <label for="note">Your note:</label><br>
    <textarea id="note" name="note" rows="6" required></textarea><br><br>
    <button type="submit">Post</button>
  </form>
</body>
</html>
